# ============================================================================
# Mission Parameters — APF + IBVS + EKF Simulation
# ============================================================================
# ROS 2 parameter-file format.  The launcher passes this file to every
# autonomous node, so changing a value here affects the actual simulation.

apf_planner:
  ros__parameters:
    use_sim_time: true
    planner_type: "iapf"        # "apf" (standard) or "iapf" (improved 3D)
    d0: 2.5
    v_max: 1.5
    d_slow: 1.2
    target_altitude: 3.0
    k_att: 10.0
    k_rep: 2500.0
    k_rep_approach: 125.0
    goal_threshold: 0.30
    follow_distance: 3.5
    hold_follow_altitude: true
    target_lead_time: 0.35
    max_target_lead: 1.0
    target_velocity_alpha: 0.35
    target_velocity_deadband: 0.18
    # IAPF specific parameters
    iapf_f_enter: 0.10
    iapf_f_exit: 0.30
    iapf_k_tan: 1.0
    iapf_n_tangent: 12
    iapf_n_pred: 3
    iapf_w_goal: 1.0
    iapf_w_clear: 1.0
    iapf_w_prev: 0.60

ekf_ros_adapter:
  ros__parameters:
    use_sim_time: true
    # Lower horizontal process noise keeps static-pad covariance inside the
    # landing gate at the camera's measured update rate while retaining
    # enough acceleration freedom for a 0.5 m/s target.
    process_accel_variance: [0.25, 0.25, 0.5]
    gate_threshold: 16.27
    predict_rate_hz: 50.0
    source_frame: camera_optical_frame
    target_frame: world
    max_target_speed: 2.5
    min_marker_distance: 0.05

aruco_sim_node:
  ros__parameters:
    use_sim_time: true
    use_dual_scale: true
    marker_id: 42
    marker_size_m: 0.52
    small_marker_id: 43
    small_marker_size_m: 0.05
    min_detection_distance_m: 0.05
    max_detection_distance_m: 15.0

covariance_gate_node:
  ros__parameters:
    use_sim_time: true
    pad_radius_m: 0.42
    confidence_sigma: 2.0
    max_measurement_age_s: 0.5
    max_horizontal_distance_m: 5.0
    rswitch_base_m: 1.5
    rswitch_alpha: 1.0
    r_switch_min_m: 3.0
    r_switch_max_m: 15.0
    sigma_ideal_m: 0.05
    sigma_bad_m: 0.30
    sigma_max_continue_glide_m: 0.15
    sliding_beta: 2.0
    # Gazebo truth odometry is precise; use these only if the bridge omits covariance.
    # Replace with calibrated PX4 covariance values for real flight.
    default_drone_eph_m: 0.03
    default_drone_epv_m: 0.05
    eval_rate_hz: 20.0

smc_guidance_node:
  ros__parameters:
    use_sim_time: true
    v_max: 1.50
    v_final_xy_max: 0.35
    v_descend_fast: 0.20
    v_descend_touch: 0.15
    rswitch_default: 0.80
    final_descent_rxy_m: 1.00
    final_descent_alt_m: 1.50
    final_uncertainty_max_2sigma_m: 0.12
    max_state_age_s: 0.30
    max_covariance_age_s: 0.30
    control_rate_hz: 20.0

ibvs_controller:
  ros__parameters:
    use_sim_time: true
    K_pitch: 0.92
    K_yaw: 0.92
    focal_x: 466.0
    focal_y: 466.0
    u0: 320.0
    v0: 240.0
    search_yaw_rate: 0.15
    pitch_rate_limit: 2.0
    approach_pitch_rate_limit: 0.50
    pitch_ema_alpha: 0.42
    pitch_pixel_trim_gain: 0.75
    yaw_rate_limit: 0.80
    yaw_feedforward_min_target_speed: 0.30
    yaw_feedforward_max_rate: 0.15
    target_state_timeout: 0.50
    target_prediction_horizon: 0.25
    landing_pitch_rate_limit: 0.50
    bbox_timeout: 0.30
    drone_model: x500_depth_0

mission_fsm:
  ros__parameters:
    use_sim_time: true
    follow_distance: 3.5
    search_timeout: 3.0
    approach_timeout: 3.0
    smc_command_timeout: 0.20
    apf_command_timeout: 0.25
    covariance_status_timeout: 0.30
    covariance_revert_timeout: 3.0
    max_uncertainty_enter_glide_2sigma_m: 0.20
    max_uncertainty_continue_glide_2sigma_m: 0.30
    final_descent_rxy_m: 1.00
    final_descent_alt_m: 1.50
    final_uncertainty_max_2sigma_m: 0.12
    takeoff_altitude: 3.0
    yaw_align_enable: true
    yaw_align_enter_deg: 25.0
    yaw_align_exit_deg: 10.0
    yaw_align_u0_px: 320.0
    yaw_align_v0_px: 240.0
    yaw_align_u_tolerance_px: 50.0
    yaw_align_u_stop_px: 250.0
    yaw_align_min_speed_scale: 0.60
    yaw_align_speed_filter_alpha: 0.35
    reacquire_confirm_time: 0.30
    reacquire_hold_timeout: 4.0
    reacquire_lost_timeout: 2.0
    reacquire_bbox_timeout: 0.80
    follow_bbox_timeout: 0.30
    follow_detection_hold_timeout: 0.25
    landing_tracking_timeout: 0.30
    reacquire_max_yaw_rate_deg: 20.0
    follow_entry_hold_time: 0.10
    search_entry_hold_time: 0.30
    follow_speed_limit: 1.50

offboard_commander:
  ros__parameters:
    use_sim_time: true
    auto_arm: true
    auto_offboard: true
    min_offboard_alt: 2.0
    max_accel: 0.8
    max_yaw_rate: 0.80
    enable_alt_hold: true
    target_altitude: 3.0
    alt_hold_kp: 1.0
    mission_command_timeout: 0.25

touchdown_detector:
  ros__parameters:
    use_sim_time: true
    optical_height_threshold_m: 0.40
    descent_cmd_threshold_mps: -0.10
    stoppage_vz_max_mps: 0.08
    stoppage_dz_dt_max_mps: 0.05
    jerk_impact_threshold: 3.50
    confirmation_duration_s: 0.35
    altitude_ceiling_m: 0.80
    rate_hz: 20.0
