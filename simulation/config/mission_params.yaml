# ============================================================================
# Mission Parameters — APF + IBVS + EKF Simulation
# ============================================================================
# ROS 2 parameter-file format.  The launcher passes this file to every
# autonomous node, so changing a value here affects the actual simulation.

apf_planner:
  ros__parameters:
    use_sim_time: true
    planner_type: "iapf"        # "apf" (standard) or "iapf" (improved 3D)
    d0: 2.5
    v_max: 1.5
    d_slow: 1.2
    target_altitude: 3.0
    k_att: 10.0
    k_rep: 2500.0
    k_rep_approach: 125.0
    goal_threshold: 0.20
    follow_distance: 3.5
    hold_follow_altitude: true
    target_lead_time: 0.35
    max_target_lead: 1.0
    target_velocity_alpha: 0.35
    target_velocity_deadband: 0.18
    # IAPF specific parameters
    iapf_f_enter: 0.10
    iapf_f_exit: 0.30
    iapf_k_tan: 1.0
    iapf_n_tangent: 12
    iapf_n_pred: 3
    iapf_w_goal: 1.0
    iapf_w_clear: 1.0
    iapf_w_prev: 0.60

ekf_ros_adapter:
  ros__parameters:
    use_sim_time: true
    process_accel_variance: [1.0, 1.0, 0.5]
    gate_threshold: 16.27
    predict_rate_hz: 50.0
    source_frame: camera_optical_frame
    target_frame: world
    max_target_speed: 2.5
    min_marker_distance: 0.05

aruco_sim_node:
  ros__parameters:
    use_sim_time: true
    use_dual_scale: true
    marker_id: 42
    marker_size_m: 0.40
    small_marker_id: 43
    small_marker_size_m: 0.05
    min_detection_distance_m: 0.05
    max_detection_distance_m: 15.0

covariance_gate_node:
  ros__parameters:
    use_sim_time: true
    pad_radius_m: 0.25
    confidence_sigma: 2.0
    max_measurement_age_s: 0.5
    max_horizontal_distance_m: 5.0
    rswitch_base_m: 1.5
    rswitch_alpha: 1.0
    sliding_beta: 2.0
    default_drone_eph_m: 0.10
    default_drone_epv_m: 0.15
    eval_rate_hz: 20.0

ibvs_controller:
  ros__parameters:
    use_sim_time: true
    K_pitch: 0.8
    K_yaw: 0.85
    focal_x: 466.0
    focal_y: 466.0
    u0: 320.0
    v0: 240.0
    search_yaw_rate: 0.20
    pitch_rate_limit: 1.8
    pitch_ema_alpha: 0.30
    pitch_pixel_trim_gain: 0.6
    yaw_rate_limit: 0.45
    drone_model: x500_depth_0

mission_fsm:
  ros__parameters:
    use_sim_time: true
    follow_distance: 3.5
    alignment_threshold: 0.3
    land_altitude: 0.5
    search_timeout: 3.0
    approach_timeout: 3.0
    takeoff_altitude: 3.0
    land_descent_speed: 0.3
    yaw_align_enable: true
    yaw_align_enter_deg: 25.0
    yaw_align_exit_deg: 10.0
    yaw_align_u0_px: 320.0
    yaw_align_v0_px: 240.0
    yaw_align_u_tolerance_px: 50.0
    yaw_align_u_stop_px: 250.0
    yaw_align_min_speed_scale: 0.60
    yaw_align_speed_filter_alpha: 0.35
    reacquire_confirm_time: 0.35
    reacquire_hold_timeout: 4.0
    reacquire_lost_timeout: 1.5
    reacquire_bbox_timeout: 0.8
    reacquire_max_yaw_rate_deg: 12.0
    follow_entry_hold_time: 0.25
    search_entry_hold_time: 0.30

offboard_commander:
  ros__parameters:
    use_sim_time: true
    auto_arm: true
    auto_offboard: true
    min_offboard_alt: 2.0
    max_accel: 0.8
    max_yaw_rate: 0.80
    enable_alt_hold: true
    target_altitude: 3.0
    alt_hold_kp: 1.0
