# ============================================================================
# Mission Parameters — APF + IBVS + EKF Simulation
# ============================================================================
# ROS 2 parameter-file format.  The launcher passes this file to every
# autonomous node, so changing a value here affects the actual simulation.

apf_planner:
  ros__parameters:
    d0: 2.5
    v_max: 1.5
    d_slow: 1.5
    target_altitude: 3.0
    k_att: 10.0
    k_rep: 2500.0
    k_rep_approach: 125.0
    goal_threshold: 0.20
    follow_distance: 3.5
    hold_follow_altitude: true

ekf_ros_adapter:
  ros__parameters:
    process_accel_variance: [1.0, 1.0, 0.5]
    gate_threshold: 16.27
    predict_rate_hz: 50.0
    source_frame: camera_optical_frame
    target_frame: world
    max_target_speed: 2.5
    min_marker_distance: 2.2

aruco_sim_node:
  ros__parameters:
    marker_size_m: 0.895
    min_detection_distance_m: 2.2

ibvs_controller:
  ros__parameters:
    K_pitch: 0.8
    K_yaw: 0.5
    search_yaw_rate: 0.2618
    pitch_rate_limit: 3.1416
    pitch_ema_alpha: 0.25
    yaw_rate_limit: 0.6
    drone_model: x500_depth_0

mission_fsm:
  ros__parameters:
    detection_confirm_frames: 3
    follow_distance: 3.5
    alignment_threshold: 0.3
    land_altitude: 0.5
    search_timeout: 3.0
    approach_timeout: 3.0
    takeoff_altitude: 3.0
    land_descent_speed: 0.3

offboard_commander:
  ros__parameters:
    auto_arm: true
    auto_offboard: true
    min_offboard_alt: 2.0
    max_accel: 2.0
