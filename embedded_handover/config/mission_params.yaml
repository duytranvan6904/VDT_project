# ============================================================================
# Mission Parameters — APF + IBVS + EKF Simulation
# ============================================================================
# Định dạng file tham số ROS 2 (ROS 2 parameter file format).
# File này được nạp cho toàn bộ các node tự hành trong hệ thống mô phỏng,
# việc thay đổi các giá trị tại đây sẽ trực tiếp tác động đến hành vi của drone.

# ----------------------------------------------------------------------------
# 1. BỘ QUY HOẠCH QUỸ ĐẠO LỰC THẾ NHÂN TẠO (APF / IAPF TRAJECTORY PLANNER)
# ----------------------------------------------------------------------------
apf_planner:
  ros__parameters:
    use_sim_time: true                    # Sử dụng thời gian mô phỏng từ topic /clock của Gazebo
    planner_type: "iapf"                  # Thuật toán quy hoạch: "apf" (chuẩn) hoặc "iapf" (cải tiến 3D tránh bẫy cực tiểu)
    d0: 2.8                               # Bắt đầu bẻ hướng né vật cản an toàn quanh bán kính 2.8m
    v_max: 2.2                            # Tốc độ bám mục tiêu trần 2.2 m/s, bắt kịp bãi chạy 1.0 m/s mượt mà
    d_slow: 1.5                           # Dải hãm tốc mượt mà trước mục tiêu, bảo toàn góc nhìn gimbal trong FOV
    target_altitude: 3.0                  # Độ cao bay mong muốn mà drone duy trì trong chế độ APF (m)
    k_att: 10.0                           # Hệ số lực hút hướng về mục tiêu (Attractive potential gain)
    k_rep: 50.0                           # Lực đẩy điều hòa mượt mà ~30N (thay vì 2500N gây nảy giật thân dữ dội)
    k_rep_approach: 25.0                  # Lực né vật cản êm dịu trong pha APPROACH
    goal_threshold: 0.30                  # Bán kính ngưỡng coi như đã đạt đến mục tiêu (m)
    follow_distance: 2.2                  # Khoảng cách bám đuổi mục tiêu mong muốn theo phương ngang (m)
    hold_follow_altitude: true            # Bật/tắt duy trì độ cao cố định trong pha FOLLOW
    target_lead_time: 0.25                # Bù trễ điều khiển/perception khi bãi đáp chạy
    max_target_lead: 0.50                 # Giới hạn dịch chuyển goal do dự đoán mục tiêu (m)
    target_velocity_alpha: 0.50           # Bắt vận tốc mục tiêu 1.0 m/s nhanh nhạy, giảm trễ bám đuổi
    target_velocity_deadband: 0.15        # Vùng chết vận tốc mục tiêu (m/s)
    vehicle_radius_m: 0.30                # Bán kính an toàn ngang cho thân/rotor x500 trong mô phỏng
    obstacle_clearance_margin_m: 0.35     # Khoảng hở an toàn thực tế (tổng bán kính an toàn 0.65m quanh thân)
    obstacle_braking_accel_mps2: 1.40     # Gia tốc hãm an toàn khớp năng lực động học thực tế của drone (1.6 m/s^2)
    obstacle_reaction_time_s: 0.25        # Dự phòng trễ xử lý điều khiển và cơ cấu chấp hành
    # Tham số riêng cho thuật toán IAPF (Improved Artificial Potential Field)
    iapf_f_enter: 0.50                    # Ngưỡng lực cản kích hoạt rẽ nhánh tiếp tuyến né vật cản (mặt phẳng tiếp tuyến 3D)
    iapf_f_exit: 1.50                     # Ngưỡng lực cản để thoát khỏi chế độ rẽ nhánh tiếp tuyến và bay thẳng về đích
    iapf_k_tan: 2.0                       # Hệ số độ lớn của lực tiếp tuyến (Tangential force gain) giúp bọc vòng qua chướng ngại vật
    iapf_n_tangent: 12                    # Số lượng tia tiếp tuyến lấy mẫu đánh giá trong không gian 3D
    iapf_n_pred: 3                        # Số bước dự đoán quỹ đạo phía trước (forward prediction steps)
    iapf_w_goal: 1.0                      # Trọng số ưu tiên hướng về đích trong hàm chi phí chọn hướng bay tốt nhất
    iapf_w_clear: 1.0                     # Trọng số ưu tiên khoảng cách thông thoáng tới chướng ngại vật gần nhất
    iapf_w_prev: 0.60                     # Trọng số ưu tiên giữ hướng bay mượt mà, tránh đổi hướng đột ngột so với chu kỳ trước

# ----------------------------------------------------------------------------
# 2. BỘ LỌC EKF ƯỚC LƯỢNG TRẠNG THÁI MỤC TIÊU (EXTENDED KALMAN FILTER)
# ----------------------------------------------------------------------------
ekf_ros_adapter:
  ros__parameters:
    use_sim_time: true                    # Sử dụng thời gian mô phỏng từ Gazebo
    # Phương sai gia tốc mô hình chuyển động quá trình [x, y, z] (m^2/s^4)
    # Giá trị nhỏ giúp ma trận hiệp phương sai của bãi đáp tĩnh thu hẹp nhanh vào cổng hạ cánh
    process_accel_variance: [0.25, 0.25, 0.5]
    gate_threshold: 16.27                 # Ngưỡng kiểm định Chi-bình phương (Chi-square gate) loại bỏ phép đo thị giác sai lệch/nhiễu
    predict_rate_hz: 50.0                 # Tần số chu kỳ dự đoán trạng thái EKF (Hz)
    source_frame: camera_optical_frame    # Hệ quy chiếu quang học của camera nơi thu nhận tọa độ marker
    target_frame: world                   # Hệ quy chiếu toàn cục quy đổi sang tọa độ chung của môi trường
    max_target_speed: 2.5                 # Giới hạn vận tốc tối đa của mục tiêu (m/s) để loại trừ ước lượng phi lý
    max_coast_prediction_s: 2.5            # Giới hạn ngoại suy vị trí khi mất dấu; duy trì dự đoán quán tính qua vật cản
    min_marker_distance: 0.05             # Khoảng cách tối thiểu tin cậy từ camera tới marker (m)
    reacquire_margin_m: 0.50              # Biên sai số khi bắt lại target theo quãng đường tối đa có thể di chuyển
    max_reacquire_distance_m: 15.0        # Trần ngân sách dịch chuyển sau dropout dài; cần 2 frame nhất quán mới reset EKF
    target_surface_z_m: 0.02              # Mặt H-pad mô phỏng nằm ngang; cố định z để PnP nghiêng không làm nhảy pose theo phương đứng

# ----------------------------------------------------------------------------
# 3. NODE NHẬN DIỆN ARUCO MARKER (ARUCO DETECTOR)
# ----------------------------------------------------------------------------
aruco_sim_node:
  ros__parameters:
    use_sim_time: true                    # Sử dụng thời gian mô phỏng từ Gazebo
    use_dual_scale: true                  # Bật tính năng nhận diện kép 2 marker lồng nhau (dual-scale)
    marker_id: 42                         # Mã ID của ArUco marker lớn (dùng cho bám bắt tầm xa/trên cao)
    marker_size_m: 0.52                   # Kích thước cạnh của ArUco marker lớn (m)
    small_marker_id: 43                   # Mã ID của ArUco marker nhỏ ở tâm (dùng cho pha hạ cánh cự ly sát đất)
    small_marker_size_m: 0.05             # Kích thước cạnh của ArUco marker nhỏ (m) chuẩn theo board A0 52-5cm
    min_detection_distance_m: 0.05        # Cự ly nhận diện tối thiểu (m)
    max_detection_distance_m: 15.0        # Cự ly nhận diện tối đa (m)

# ----------------------------------------------------------------------------
# 4. CỔNG HIỆP PHƯƠNG SAI AN TOÀN HẠ CÁNH (COVARIANCE GATE NODE)
# ----------------------------------------------------------------------------
covariance_gate_node:
  ros__parameters:
    use_sim_time: true                    # Sử dụng thời gian mô phỏng
    pad_radius_m: 0.75                    # Bán kính phễu vật lý của bãi đáp H-Pad / Marker (m) - nới lên 0.75m để bao phủ động năng bãi đáp
    confidence_sigma: 2.0                 # Hệ số tin cậy k-sigma cho elip hiệp phương sai (2.0 sigma tương đương ~95.4%)
    max_measurement_age_s: 0.5            # Thời gian tồn tại tối đa của phép đo thị giác (s) trước khi bị coi là mất tín hiệu
    max_horizontal_distance_m: 8.0        # Khoảng cách ngang tối đa cho phép để bắt đầu xét điều kiện vào phễu hạ cánh (m)
    rswitch_base_m: 1.5                   # Bán kính chuyển đổi cơ sở giữa vùng tiếp cận và vùng trượt SMC (m)
    rswitch_alpha: 1.0                    # Hệ số mở rộng bán kính chuyển đổi r_switch theo độ cao hiện tại
    r_switch_min_m: 4.5                   # Giới hạn dưới của bán kính phễu chuyển đổi r_switch (m)
    r_switch_max_m: 10.0                  # Giới hạn trên của bán kính phễu chuyển đổi r_switch (m)
    sigma_ideal_m: 0.04                   # Độ lệch chuẩn sai số lý tưởng kỳ vọng (m) khi camera nhìn rõ marker ở tầm gần
    sigma_bad_m: 0.45                     # Ngưỡng độ lệch chuẩn sai số bị coi là quá kém (m) - nới lên 0.45m
    sigma_max_continue_glide_m: 0.45      # Độ lệch chuẩn sai số tối đa cho phép để tiếp tục giai đoạn trượt glide
    sliding_beta: 2.0                     # Hệ số thích nghi mặt trượt SMC theo độ bất định hiệp phương sai
    use_marker_relative: true             # Kích hoạt quy đổi sang hệ quy chiếu tương đối gắn trên marker (Marker-relative)
    attitude_sigma_rad: 0.0087            # Độ không đảm bảo góc nghiêng roll/pitch của drone (~0.5 độ tính theo rad)
    default_drone_eph_m: 0.03             # Sai số ước lượng vị trí ngang mặc định của drone (m)
    default_drone_epv_m: 0.05             # Sai số ước lượng độ cao mặc định của drone (m)
    eval_rate_hz: 20.0                    # Tần số đánh giá cổng hiệp phương sai Covariance Gate (Hz)

# ----------------------------------------------------------------------------
# 5. BỘ DẪN ĐƯỜNG ĐIỀU KHIỂN TRƯỢT HẠ CÁNH CHÍNH XÁC (SMC GUIDANCE NODE)
# ----------------------------------------------------------------------------
smc_guidance_node:
  ros__parameters:
    use_sim_time: true                    # Sử dụng thời gian mô phỏng
    v_max: 1.80                           # Đủ tốc độ tiếp cận bãi đáp chạy 1.0 m/s, kể cả khi cần hiệu chỉnh sai số ngang
    v_final_xy_max: 1.30                  # Bù vận tốc bãi 1.0 m/s và còn dư điều chỉnh khi hạ thấp
    v_descend_fast: 0.55                  # Tốc độ hạ độ cao trong giai đoạn trượt chéo glide và bãi tĩnh (m/s)
    v_descend_touch: 0.22                 # Tốc độ hạ độ cao sát mặt sàn (m/s)
    rswitch_default: 5.00                 # Bán kính mặt trượt chuyển đổi mặc định khi chưa có thông số từ Covariance Gate (m)
    final_descent_rxy_m: 0.85             # Bán kính sai số ngang tối đa để chuyển sang pha hạ cánh thẳng đứng (m)
    final_descent_alt_m: 0.60             # Độ cao bắt đầu pha hạ cánh thẳng đứng cuối cùng (m)
    final_uncertainty_max_2sigma_m: 0.90  # Độ bất định hiệp phương sai 2-sigma tối đa cho phép để tiến hành hạ thẳng đứng (m)
    target_velocity_ff_gain: 1.00         # Bù đủ vận tốc bãi trong glide và pha hạ cánh cuối
    max_state_age_s: 0.60                 # Thời gian tối đa giữ trạng thái mục tiêu từ EKF trước khi coi là mất tín hiệu (s)
    max_covariance_age_s: 0.60            # Thời gian tối đa giữ dữ liệu cổng hiệp phương sai trước khi timeout (s)
    control_rate_hz: 20.0                 # Tần số chu kỳ tính toán luật điều khiển trượt SMC (Hz)

# ----------------------------------------------------------------------------
# 6. BỘ ĐIỀU KHIỂN THỊ GIÁC SERVO GIMBAL & YAW (IBVS CONTROLLER)
# ----------------------------------------------------------------------------
ibvs_controller:
  ros__parameters:
    use_sim_time: true                    # Sử dụng thời gian mô phỏng
    K_pitch: 0.92                         # Hệ số tỉ lệ P điều khiển góc pitch gimbal bám theo sai số pixel dọc (v - v0)
    K_yaw: 0.92                           # Hệ số tỉ lệ P điều khiển góc xoay yaw của drone bám theo sai số pixel ngang (u - u0)
    focal_x: 466.0                        # Tiêu cự camera góc rộng FOV 1.204 rad trên ảnh 640x480 (pixels)
    focal_y: 466.0                        # Tiêu cự camera góc rộng FOV 1.204 rad trên ảnh 640x480 (pixels)
    u0: 320.0                             # Tọa độ tâm ảnh theo trục X (pixels) trên ảnh 640x480
    v0: 240.0                             # Tọa độ tâm ảnh theo trục Y (pixels) trên ảnh 640x480
    search_yaw_rate: 0.0                  # ĐÃ ĐẶT 0.0: Bỏ quay tròn thân drone khi mất dấu để drone ổn định tuyệt đối
    search_pitch_sweep_enable: true       # Bật quét góc pitch của servo gimbal để tìm kiếm mục tiêu
    search_pitch_sweep_min_deg: -55.0     # Góc pitch thấp nhất khi quét (nhìn chếch xuống đất phía trước)
    search_pitch_sweep_max_deg: -25.0     # Góc pitch cao nhất khi quét (nhìn tầm xa 6-7m)
    search_pitch_sweep_speed_deg: 15.0    # Tốc độ quét góc pitch của servo gimbal (độ/s)
    pitch_rate_limit: 0.60                # Giới hạn tốc độ yaw/pitch servo thị giác, gồm cả khi bắt lại marker (rad/s)
    approach_pitch_rate_limit: 0.60       # Giới hạn tốc độ gimbal khi tiếp cận để tránh giật hình (rad/s)
    pitch_ema_alpha: 0.25                 # Lọc mạnh lệnh pitch để triệt nhiễu góc từ EKF và bbox
    pitch_pixel_trim_gain: 0.30           # Chỉ dùng pixel để vi chỉnh nhẹ quanh hướng hình học
    yaw_rate_limit: 0.75                  # Giới hạn tốc độ tham chiếu yaw IBVS (rad/s) đồng bộ 43°/s
    yaw_feedforward_min_target_speed: 0.30 # Vận tốc mục tiêu tối thiểu để kích hoạt feedforward xoay yaw đón đầu (m/s)
    yaw_feedforward_max_rate: 0.15        # Tốc độ xoay yaw feedforward tối đa cho phép (rad/s)
    target_state_timeout: 0.50            # Thời gian tối đa chấp nhận trạng thái mục tiêu trước khi coi là mất dấu (s)
    target_prediction_horizon: 0.25       # Khoảng thời gian dự đoán vị trí mục tiêu phía trước để hướng camera đón đầu (s)
    landing_pitch_rate_limit: 0.35        # Giới hạn tốc độ gimbal trong LAND để tránh camera giật khi bbox nhấp nháy (rad/s)
    landing_surface_z_m: 0.02             # Cao độ mặt ArUco H-pad theo world frame; bỏ nhiễu z của EKF khi ngắm camera
    nadir_yaw_cutoff_deg: -60.0           # Ngưỡng pitch âm sâu để ngắt servo yaw từ pixel (chống xoay tít nadir) (độ)
    bbox_timeout: 0.30                    # Thời gian timeout của bounding box phát hiện thị giác (s)
    drone_model: x500_depth_0             # Tên model mô phỏng của drone trong Gazebo

# ----------------------------------------------------------------------------
# 7. MÁY TRẠNG THÁI NHIỆM VỤ TRUNG TÂM (MISSION FINITE STATE MACHINE - FSM)
# ----------------------------------------------------------------------------
mission_fsm:
  ros__parameters:
    use_sim_time: true                    # Sử dụng thời gian mô phỏng
    follow_distance: 2.2                  # Cự ly ngang mong muốn khi bám đuổi mục tiêu trong pha FOLLOW (m) - giảm về 2.2m để luôn nằm sâu trong FOV camera
    search_timeout: 5.0                   # Thời gian mất dấu mục tiêu trước khi FSM chuyển từ FOLLOW quay về SEARCH (s)
    approach_timeout: 7.0                 # Chờ camera/EKF bắt lại marker qua các nhịp mất dấu ngắn trước khi wave-off
    smc_command_timeout: 0.60             # Thời gian timeout của lệnh vận tốc từ bộ điều khiển SMC (s)
    apf_command_timeout: 0.60             # Thời gian timeout của lệnh vận tốc từ bộ quy hoạch APF (s)
    covariance_status_timeout: 0.60       # Thời gian timeout của bản tin trạng thái từ Covariance Gate (s)
    covariance_revert_timeout: 4.0        # Thời gian chờ tối đa khi điều kiện cổng hiệp phương sai không đạt trước khi hủy hạ cánh về FOLLOW (s)
    max_uncertainty_enter_glide_2sigma_m: 0.80  # Ngưỡng độ bất định 2-sigma tối đa để FSM cho phép bắt đầu trượt glide (m)
    max_uncertainty_continue_glide_2sigma_m: 0.90 # Ngưỡng độ bất định 2-sigma tối đa để FSM duy trì giai đoạn trượt glide (m)
    final_descent_rxy_m: 0.85             # Bán kính sai số ngang tối đa để bắt đầu hạ cánh thẳng đứng LAND (m)
    final_descent_alt_m: 0.60             # Độ cao trần bắt đầu chuyển sang hạ cánh thẳng đứng LAND (m)
    final_uncertainty_max_2sigma_m: 0.90  # Ngưỡng sai số 2-sigma tối đa cho phép tiến hành hạ cánh thẳng đứng (m)
    takeoff_altitude: 3.0                 # Độ cao cất cánh ban đầu mong muốn (m)
    # Cơ chế điều hòa vận tốc theo độ thẳng hàng góc yaw (Yaw alignment scaling)
    yaw_align_enable: true                # Bật/tắt tính năng giảm tốc độ bay tịnh tiến khi góc yaw chưa thẳng hàng với mục tiêu
    yaw_align_enter_deg: 30.0             # Sai lệch góc yaw bắt đầu kích hoạt giảm tốc độ tịnh tiến (độ)
    yaw_align_exit_deg: 15.0              # Sai lệch góc yaw đủ nhỏ để phục hồi toàn bộ 100% tốc độ bay tịnh tiến (độ)
    yaw_align_u0_px: 320.0                # Tọa độ pixel tâm ảnh trục X dùng kiểm tra cân chỉnh tâm trên 640x480
    yaw_align_v0_px: 240.0                # Tọa độ pixel tâm ảnh trục Y dùng kiểm tra cân chỉnh tâm trên 640x480
    yaw_align_u_tolerance_px: 65.0        # Dung sai pixel trục ngang cho phép coi như mục tiêu đã ở giữa khung hình (pixels)
    yaw_align_u_stop_px: 260.0            # Sai lệch pixel tối đa mà tại đó drone dừng bay tịnh tiến để ưu tiên xoay yaw (pixels)
    yaw_align_min_speed_scale: 0.80       # Tỉ lệ vận tốc tối thiểu (0.80 = 80%) giảm nhẹ, không cắt giật làm lắc pitch
    yaw_align_speed_filter_alpha: 0.20    # Hệ số lọc làm mịn biến thiên tỉ lệ tốc độ tịnh tiến mượt mà
    follow_forward_heading_gate_deg: 105.0 # Mở rộng cổng tiến lên 105° để cho phép trượt né vật cản ngang thân không bị nghẽn
    course_yaw_rate_limit: 0.75           # Giới hạn tốc độ quay thân khi bãi đổi course (rad/s ~43°/s) bám kịp khúc cua 90°
    follow_yaw_motion_min_speed: 0.30     # Vận tốc EKF tối thiểu để xác nhận bãi đang chạy (m/s)
    follow_yaw_motion_enter_confirm_s: 0.50 # Xác nhận target chạy nhanh nhạy (0.5s thay vì trễ 2.0s)
    follow_yaw_motion_exit_confirm_s: 0.60  # Xác nhận target dừng nhanh nhạy đổi về IBVS (0.6s thay vì 2.0s)
    follow_yaw_velocity_filter_tau_s: 0.25   # Hằng số lọc thông thấp vận tốc target trước khi chọn course (s)
    follow_yaw_course_consistency_deg: 40.0 # Độ lệch hướng tối đa cho phép trong giai đoạn xác nhận chuyển động (°)
    # Cơ chế xác nhận bắt lại mục tiêu ổn định (Reacquisition handshake)
    reacquire_confirm_time: 0.20          # Thời gian quan sát mục tiêu liên tục ổn định để xác nhận bắt lại mục tiêu thành công (s)
    reacquire_hold_timeout: 4.0           # Thời gian tối đa cho một lần xác nhận EKF sau khi detector bắt lại (s)
    reacquire_retry_delay: 0.75           # Chờ ngắn rồi thử xác nhận lại nếu detector thấy marker nhưng EKF chưa nhận pose
    reacquire_lost_timeout: 2.0           # Thời gian mất dấu hoàn toàn trước khi khởi động lại vòng quét tìm kiếm (s)
    reacquire_bbox_timeout: 0.80          # Thời gian tối đa chấp nhận bounding box cũ sau khi kích hoạt bắt lại mục tiêu (s)
    follow_bbox_timeout: 0.60             # Đồng bộ freshness với cửa sổ camera/EKF ở pha follow
    follow_detection_hold_timeout: 1.20   # Thời gian duy trì trạng thái phát hiện khi mất dấu tức thời trong FOLLOW (s)
    follow_coast_timeout: 5.00            # Thời gian bay dead-reckoning qua vật cản che khuất trong pha FOLLOW (s)
    landing_tracking_timeout: 0.50        # Khớp cửa sổ trạng thái EKF, tránh dừng lệnh hạ cánh vì một nhịp camera chậm
    reacquire_max_yaw_rate_deg: 35.0      # Vận tốc quay yaw tối đa cho phép khi xác nhận bắt lại mục tiêu (độ/s)
    follow_entry_hold_time: 0.35          # Thời gian giữ ổn định khi vừa bước vào pha FOLLOW trước khi kích hoạt di chuyển (s)
    search_entry_hold_time: 0.30          # Thời gian giữ ổn định khi vừa bước vào pha SEARCH trước khi xoay quét (s)
    follow_speed_limit: 2.2              # Tốc độ bám đuổi trần đồng bộ 2.2 m/s, bắt kịp bãi chạy 1.0 m/s
    align_yaw_with_target_motion: false   # Căn góc yaw theo hướng xe chạy khi hạ cánh (false = giữ heading chốt, true = bám course xe)
    # Cơ chế dead-reckoning coast khi mất tracking sát mặt đất (Landing Coast)
    land_coast_timeout: 5.00              # Ngoại suy có giới hạn theo ROS/simulation time; bao phủ dropout đo được đến 4.2s
                                          # Phải dài hơn confirmation_duration_s để bao phủ toàn bộ cửa sổ xác nhận disarm
    land_fallback_target_velocity_min_speed: 0.25 # Chỉ bù course mục tiêu trong fallback khi EKF ước lượng đủ rõ đang chạy
    land_fallback_xy_speed_limit: 1.35     # Giới hạn vận tốc ngang khi LAND fallback: đủ bám bãi 1.0 m/s và hiệu chỉnh an toàn
    land_waveoff_near_ground_alt: 0.20    # Chỉ chặn wave-off sát touchdown; ở cao hơn phải quay lại APPROACH nếu bãi đi xa
    auto_reland_after_abort: false        # Chính sách an toàn: Hủy latch lệnh hạ cánh sau khi wave-off; drone giữ độ cao an toàn 3m và chờ lệnh landing mới từ người điều khiển

# ----------------------------------------------------------------------------
# 8. BỘ CHỈ HUY VÀ GIAO TIẾP OFFBOARD VỚI AUTOPILOT PX4 (OFFBOARD COMMANDER)
# ----------------------------------------------------------------------------
offboard_commander:
  ros__parameters:
    use_sim_time: true                    # Sử dụng thời gian mô phỏng
    auto_arm: true                        # Tự động gửi lệnh ARM tới PX4 khi khởi động node
    auto_offboard: true                   # Tự động gửi lệnh chuyển sang chế độ OFFBOARD khi đủ điều kiện
    min_offboard_alt: 2.0                 # Độ cao an toàn tối thiểu để cho phép kích hoạt OFFBOARD (m) - tránh bật khi còn ở mặt đất
    max_accel: 1.60                       # Gia tốc bám đuổi 1.60 m/s^2 nhạy bén, kiểm soát góc nghiêng roll/pitch <= 9.5 độ
    max_yaw_rate: 0.75                    # Trần tốc độ yaw PX4 đồng bộ với IBVS/FSM; cho phép bám quay 43°/s
    enable_alt_hold: true                 # Bật thuật toán tự động giữ độ cao khép kín (Closed-loop Altitude Hold)
    target_altitude: 3.0                  # Độ cao mục tiêu duy trì khi giữ độ cao (m)
    alt_hold_kp: 1.0                      # Hệ số tỉ lệ P cho bộ điều khiển giữ độ cao
    mission_command_timeout: 0.60         # Thời gian an toàn tối đa nếu mất lệnh từ Mission FSM thì drone tự động hãm vận tốc về 0 (s)
    touchdown_max_altitude_m: 0.14        # Ngưỡng an toàn ngắt OFFBOARD khi base_link chạm sàn bãi đáp
    vehicle_radius_m: 0.30                # Bán kính an toàn thân/rotor cho lớp kiểm tra cuối trước PX4
    obstacle_clearance_margin_m: 0.35     # Dự trữ khoảng hãm chung an toàn 0.35m
    obstacle_braking_accel_mps2: 1.40     # Gia tốc hãm an toàn khớp năng lực động học thực tế của drone
    obstacle_reaction_time_s: 0.25        # Dự phòng trễ tổng perception-to-actuation

# ----------------------------------------------------------------------------
# 9. BỘ PHÁT HIỆN TIẾP ĐẤT AN TOÀN (TOUCHDOWN DETECTOR)
# ----------------------------------------------------------------------------
touchdown_detector:
  ros__parameters:
    use_sim_time: true                    # Sử dụng thời gian mô phỏng
    optical_height_threshold_m: 0.35      # Ngưỡng độ cao đo từ camera tới marker để bắt đầu kiểm tra chạm đất (m) - nới lên 0.35m phù hợp chân đáp x500
    descent_cmd_threshold_mps: -0.10      # Ngưỡng vận tốc hạ yêu cầu (vz < -0.10 m/s) xác nhận drone đang trong hành trình hạ cánh
    stoppage_vz_max_mps: 0.08             # Vận tốc đứng tối đa khi drone đã thực sự dừng trên mặt đất (m/s)
    stoppage_dz_dt_max_mps: 0.05          # Tốc độ thay đổi độ cao tối đa khi đã dừng trên mặt đất (m/s)
    jerk_impact_threshold: 3.50           # Ngưỡng phát hiện lực phản chấn/giật gia tốc khi chân drone va chạm bề mặt bãi đáp (m/s^3)
    confirmation_duration_s: 0.18         # Xác nhận tiếp đất dứt khoát trong 0.18s (<1s) tránh lơ lửng
    fast_confirmation_duration_s: 0.10    # Xác nhận nhanh khi có va chạm hoặc PX4 báo đã hạ cánh (s)
    altitude_ceiling_m: 0.14              # /odom đo base_link; khớp chiều cao chân x500 khi đỗ trên pad
    rate_hz: 20.0                         # Tần số chu kỳ đánh giá trạng thái tiếp đất (Hz)
