_shared_land_entry: &land_entry
  land_entry_height: 0.5

_shared_fsm_offboard: &fsm_offboard_rates
  yaw_search_rate: 0.3
  land_descent_rate: 0.4

_shared_rc_kill: &rc_kill_thresholds
  kill_channel: 5
  low_threshold: 1200
  high_threshold: 1800

/input_cache_node:
  ros__parameters:
    ekf_timeout_sec: 0.5
    vision_timeout_sec: 0.5
    alt_timeout_sec: 0.5
    planner_timeout_sec: 1.0
    debug_enabled: false

/fsm_node:
  ros__parameters:
    <<: [*land_entry, *fsm_offboard_rates]
    debug_enabled: false

/gimbal_node:
  ros__parameters:
    <<: *land_entry
    kp: 1.0
    ki: 0.0
    kd: 0.1
    out_min_deg: -90.0
    out_max_deg: 90.0
    max_slew_rate_deg_s: 60.0
    debug_enabled: false

/offboard_node:
  ros__parameters:
    <<: *fsm_offboard_rates
    required_engage_cycles: 10
    watchdog_timeout_sec: 0.5
    debug_enabled: false

/kill_switch_node:
  ros__parameters:
    <<: *rc_kill_thresholds
    debounce_threshold: 3
    debug_enabled: false

/rc_node:
  ros__parameters:
    <<: *rc_kill_thresholds
    serial_device: "/dev/ttyUSB0"
    baudrate: 100000
    land_channel: 4
    frame_timeout: 0.5
    debug_enabled: false

/safety_monitor_node:
  ros__parameters:
    battery_warning_frac: 0.3
    battery_critical_frac: 0.15
    offboard_hold_timeout: 1.0
    offboard_rtl_timeout: 5.0
    debug_enabled: false