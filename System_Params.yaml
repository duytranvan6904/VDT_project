/input_cache_node:
  ros__parameters:
    ekf_timeout_sec: 0.5
    vision_timeout_sec: 0.5
    alt_timeout_sec: 0.5
    planner_timeout_sec: 1.0
    debug_enabled: false

/fsm_node:
  ros__parameters:
    land_entry_height: 0.5
    yaw_search_rate: 0.3
    land_descent_rate: 0.4
    debug_enabled: false

/gimbal_node:
  ros__parameters:
    land_entry_height: 0.5
    kp: 1.0
    ki: 0.0
    kd: 0.1
    out_min_deg: -90.0
    out_max_deg: 90.0
    max_slew_rate_deg_s: 60.0
    debug_enabled: false

/offboard_node:
  ros__parameters:
    yaw_search_rate: 0.3
    land_descent_rate: 0.4
    required_engage_cycles: 10
    mode_confirm_timeout_cycles: 20
    health_confirm_timeout_cycles: 100
    data_freshness_timeout_sec: 1.0
    max_horizontal_velocity: 2.0
    max_vertical_velocity: 1.0
    max_yaw: 3.14
    watchdog_timeout_sec: 0.5
    debug_enabled: false

/kill_switch_node:
  ros__parameters:
    kill_channel: 5
    low_threshold: 1200
    high_threshold: 1800
    debounce_threshold: 3
    debug_enabled: false

/rc_node:
  ros__parameters:
    serial_device: "/dev/ttyUSB0"
    baudrate: 100000
    land_channel: 4
    frame_timeout: 0.5
    debug_enabled: false

/safety_monitor_node:
  ros__parameters:
    battery_warning_frac: 0.3
    battery_critical_frac: 0.15
    offboard_hold_timeout: 1.0
    offboard_rtl_timeout: 5.0
    data_freshness_timeout_sec: 1.0
    force_land_latched: true
    debug_enabled: false

/servo_node:
  ros__parameters:
    gpio_pin: 18
    pwm_min_us: 600
    pwm_max_us: 2400
    angle_min_deg: 0.0
    angle_max_deg: 180.0
    home_angle_deg: 90.0
    input_timeout_sec: 1.0
    debug_enabled: false

/xrce_bridge_node:
  ros__parameters:
    serial_port: "/dev/ttyAMA0"
    baudrate: 921600
    connection_timeout_sec: 2.0
    debug_enabled: false